name: Validate StayCore

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Admin JavaScript syntax
        run: node --check admin/assets/app.js

      - name: Build WordPress installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/staycore-pms
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='node_modules' ./ dist/staycore-pms/
          test -f dist/staycore-pms/staycore-pms.php
          grep -Fqx ' * Version: 0.8.2' dist/staycore-pms/staycore-pms.php
          (cd dist && zip -qr staycore-pms-0.8.2.zip staycore-pms)
          unzip -Z1 dist/staycore-pms-0.8.2.zip | grep -qx 'staycore-pms/staycore-pms.php'
      - name: Upload WordPress plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: staycore-pms-0.8.2-wordpress-plugin
          path: dist/staycore-pms-0.8.2.zip
          if-no-files-found: error
